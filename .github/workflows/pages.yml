name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render every effect offline and check the output
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN cannot create a Pages site, so check for one first and
      # explain the one-time setup instead of failing with an API error.
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not set up::Open Settings > Pages and set Source to 'GitHub Actions', then re-run this workflow. The site was uploaded as a downloadable artifact in the meantime."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ready == 'true'
        with:
          path: web
      - id: deployment
        if: steps.pages.outputs.ready == 'true'
        uses: actions/deploy-pages@v4

      # Fallback so a run is never wasted: the built site, ready to unzip.
      - uses: actions/upload-artifact@v4
        if: steps.pages.outputs.ready != 'true'
        with:
          name: audiofx-site
          path: web
